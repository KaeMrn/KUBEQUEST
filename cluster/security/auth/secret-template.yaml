# Reference only — NOT included in kustomization.yaml and NOT applied
# automatically. Real secrets must never be committed in plaintext to Git.
# Run ./generate-secrets.sh instead, which creates these same Secrets
# directly in-cluster with random values.
apiVersion: v1
kind: Secret
metadata:
  name: dex-oauth2-proxy-client
  namespace: auth
type: Opaque
stringData:
  client-secret: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-cookie
  namespace: auth
type: Opaque
stringData:
  cookie-secret: "REPLACE_ME_32_BYTES_BASE64"
---
apiVersion: v1
kind: Secret
metadata:
  name: dex-static-passwords
  namespace: auth
type: Opaque
stringData:
  # bcrypt hash of a demo password, e.g. generated with:
  #   htpasswd -bnBC 10 "" "yourpassword" | tr -d ':\n' | sed 's/$2y/$2a/'
  admin-password-hash: "REPLACE_ME_BCRYPT_HASH"
