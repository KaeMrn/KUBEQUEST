apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Root GitOps entrypoint for every reusable cluster-management component.
# Order matters here: `monitoring` must be applied before `logging` since
# logging's chart is deployed into the `monitoring` namespace created by it.
# `deploy-all.sh` applies each folder individually in the right order rather
# than relying on `kubectl apply -k cluster/` doing it correctly in one shot.
resources:
  - flannel
  - dashboard
  - ingress-nginx
  - monitoring
  - logging
  - security/opa-gatekeeper
  - security/auth
  - security/rbac
  - security/cert-manager
