    repo: https://grafana.github.io/helm-charts
    version: 2.10.2
    releaseName: loki
    namespace: monitoring
    valuesFile: values.yaml

commonLabels:
  app.kubernetes.io/part-of: kubequest
  app.kubernetes.io/managed-by: kustomize
