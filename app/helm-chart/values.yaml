# ============================================================================
# Real app: the Laravel "counter" sample app from Gandalf (app/src), built
# from app/src/Dockerfile via scripts/build-and-push-app-image.sh. Only
# image.repository/tag need to change per where you pushed the built image —
# everything else here matches the app's actual requirements.
# ============================================================================

replicaCount: 2

image:
  # Built locally for linux/amd64 (the EC2 nodes). No public registry needed:
  #   scripts/build-and-push-app-image.sh kubequest-app v1 --local
  #   scripts/load-app-image-to-nodes.sh kubequest-app:v1
  repository: kubequest-app
  tag: "v1"
  pullPolicy: IfNotPresent

# Set if pulling from a private registry (bonus objective).
imagePullSecrets: []
# - name: regcred

# php:8.2.8-apache in app/src/Dockerfile serves on port 80.
containerPort: 80

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: app.kubequest.local
  tls:
    enabled: false
    secretName: kubequest-app-tls

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

# Redundancy: spread replicas across nodes, never co-locate 2 replicas on
# the same node.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - kubequest-app
        topologyKey: kubernetes.io/hostname

# Zero-downtime rolling updates: never go below `replicaCount`, allow 1 extra
# pod during the rollout, and only route traffic once the readiness probe
# passes (see deployment.yaml). "/" renders the counter view via a DB query,
# so it's a real dependency check, not a static 200.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

probes:
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Non-secret Laravel config. DB_PASSWORD and APP_KEY come from the Secret
# (secretName below), never from here.
config:
  APP_NAME: KubeQuest
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stack
  LOG_LEVEL: error
  DB_CONNECTION: mysql
  DB_HOST: kubequest-db-mysql # bitnami/mysql release "kubequest-db" service name
  DB_PORT: "3306"
  DB_DATABASE: kubequest_app
  DB_USERNAME: kubequest_app
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync

# Created by scripts/generate-app-secrets.sh — keys: APP_KEY, DB_PASSWORD.
secretName: app-db-credentials

# Runs `php artisan migrate --force` as a Job alongside the Deployment.
# NOT a Helm lifecycle hook: this whole chart is rendered via `helm template`
# under Kustomize (see app/gitops/base), which does not execute Helm's
# install/upgrade hook ordering — a `helm.sh/hook` annotation here would be
# inert. Real sequencing (wait for this Job before trusting the app) is done
# explicitly by scripts/deploy-all.sh instead. See templates/migrate-job.yaml.
migration:
  enabled: true

serviceAccount:
  create: true
  name: ""

labels: {}
