apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-production

resources:
  - ../../base
  # No separate Certificate resource needed: the cert-manager.io/cluster-issuer
  # annotation added to the Ingress below (ingress-shim) makes cert-manager
  # create and manage the Certificate automatically. Uses the self-signed
  # ClusterIssuer + app.kubequest.local in /etc/hosts (no public domain
  # registered). Swap the issuer to letsencrypt-prod and the host to a real
  # DNS name for a publicly-trusted cert.

patches:
  - target:
      kind: Namespace
      name: app
    patch: |
      - op: replace
        path: /metadata/name
        value: app-production

  - target:
      kind: Ingress
      name: kubequest-app
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: app.kubequest.local
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: selfsigned-issuer
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - app.kubequest.local
            secretName: kubequest-app-tls

  # Production gets more headroom than the base defaults.
  - target:
      kind: Deployment
      name: kubequest-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi

  - target:
      kind: HorizontalPodAutoscaler
      name: kubequest-app
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
