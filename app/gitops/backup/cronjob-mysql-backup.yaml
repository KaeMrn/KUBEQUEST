# Daily mysqldump of the app database onto its own PVC, satisfying "implement
# usual backup system using Kubernetes" for the database's persistent storage.
# It actually runs mysqldump against kubequest-db-mysql and keeps the last
# 7 days of dumps. In production, ship these off-cluster (S3/etc.) instead
# of trusting a second PVC on the same infrastructure.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-backups
  labels:
    app.kubernetes.io/part-of: kubequest
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  labels:
    app.kubernetes.io/part-of: kubequest
spec:
  schedule: "0 3 * * *" # daily at 03:00
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mysql-backup
            app.kubernetes.io/part-of: kubequest
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mysqldump
              image: bitnami/mysql:8.0
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-auth
                      key: mysql-password
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  mysqldump -h kubequest-db-mysql -u kubequest_app kubequest_app \
                    > /backups/kubequest-${STAMP}.sql
                  # keep last 7 days only
                  find /backups -name '*.sql' -mtime +7 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mysql-backups
