apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app

resources:
  - namespace.yaml
  - ../backup/cronjob-mysql-backup.yaml
  # Namespaced RBAC for the deploy automation's ServiceAccount — lives under
  # cluster/security/rbac because it's a security-review artifact, but it's
  # applied here because it targets the `app` namespace this file creates.
  - ../../../cluster/security/rbac/app-deployer.yaml

# `helm template` is invoked at `kubectl apply -k` / `kustomize build
# --enable-helm` time, so nothing here is a stale pre-rendered copy.
helmGlobals:
  # Resolves to app/ — the local chart lives at app/helm-chart, addressed
  # below as chartHome + entry name "helm-chart" (kustomize's local-chart
  # lookup is `<chartHome>/<name>`, independent of the name field inside
  # Chart.yaml).
  chartHome: ../..

helmCharts:
  - name: helm-chart
    releaseName: kubequest-app
    namespace: app
    # No valuesFile override here: base uses the chart's own default
    # values.yaml. Overlays patch the *rendered* Deployment/Ingress instead
    # of re-invoking Helm with different values, so one `helm template` run
    # is shared by every environment.

  - name: mysql
    repo: https://charts.bitnami.com/bitnami
    version: 11.1.16
    releaseName: kubequest-db
    namespace: app
    valuesFile: ../mysql-values.yaml

commonLabels:
  app.kubernetes.io/part-of: kubequest
  app.kubernetes.io/managed-by: kustomize
